<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>
</head>
<body>
    <header>

        <section>
            <img src="/anexos_prova/imagens_usuarios/usuario1.jpg" alt="Foto de perfil">
            <span>Restaurante,Chef</span>
            <button disabled>Ver Perfil</button>
        </section>

     
        <section>
            <h1>Restaurante,Chef</h1>
        </section>

        
        <section>
            <button onclick="document.getElementById('authModal').showModal()">Login</button>
        </section>
    </header>

    <hr>
    <main>
        <section>
            <input type="text" placeholder="Digite o nome do chef... ex: @chef1">
            <img src="lupa.svg" alt="Ícone de busca">
        </section>

        <br>

     
        <section>
            <h2>Mural de receitas</h2>

         
            <div>
           
                <article>
                    <img src="receita1.jpg" alt="Receita 1">
                    <h3>Receita 1</h3>
                    <div>
                        <img src="estrela.svg" alt="Favoritos">
                        <span>0</span>
                    </div>
                </article>

          
                <article>
                    <img src="receita2.jpg" alt="Receita 2">
                    <h3>Receita 2</h3>
                    <div>
                        <img src="estrela.svg" alt="Favoritos">
                        <span>0</span>
                    </div>
                </article>

               
                <article>
                    <img src="receita3.jpg" alt="Receita 3">
                    <h3>Receita 3</h3>
                    <div>
                        <img src="estrela.svg" alt="Favoritos">
                        <span>0</span>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <hr>

   
    <footer>
        <p>Rodapé da aplicação</p>
    </footer>


    <dialog id="authModal">
        <h2>Autenticação</h2>
        <form method="dialog">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username"><br><br>
            
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password"><br><br>
            
            <button type="submit">Entrar</button>
            <button type="button" onclick="document.getElementById('authModal').close()">Cancelar</button>
        </form>
    </dialog>

</body>
</html>
